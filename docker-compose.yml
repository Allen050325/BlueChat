services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: bluechat-synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - ./synapse:/data

  element:
    image: vectorim/element-web:latest
    container_name: bluechat-element
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config/element-config.json:/app/config.json:ro
